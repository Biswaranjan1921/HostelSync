spring:
  application:
    name: hostel-api
  datasource:
    url: jdbc:h2:file:./data/smarthostel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8085
  tomcat:
    threads:
      max: 800
      min-spare: 50
    max-connections: 4000
    accept-count: 800

app:
  cors-allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
